<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safe Video Feed</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body, h1, h2, h3, h4, h5, h6 {
            font-family: "Arial", sans-serif;
        }

        .w3-row-padding img {
            margin-bottom: 12px
        }

        .w3-sidebar {
            width: 120px;
            background: #222;
        }

        #main {
            margin-left: 120px
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            padding-top: 25px;
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .video-list {
            height: 600px;
            overflow-y: auto;
        }

        .video-item {
            cursor: pointer;
            margin-bottom: 10px;
        }

        .video-item img {
            width: 100%;
            height: auto;
        }

        .video-item-text {
            font-size: 0.8em;
        }

        /* Autocomplete styles */
        .autocomplete {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .autocomplete-items {
            position: absolute;
            border: 1px solid #d4d4d4;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            /*position the autocomplete items to be the same width as the container:*/
            top: 100%;
            left: 0;
            right: 0;
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            background-color: #fff;
            border-bottom: 1px solid #d4d4d4;
        }

        .autocomplete-items div:hover {
            /*when hovering an item:*/
            background-color: #e9e9e9;
        }

        .autocomplete-active {
            /*when navigating through the items using the arrow keys:*/
            background-color: DodgerBlue !important;
            color: #ffffff;
        }

        @media (max-width: 600px) {
            #main {
                margin-left: 0;
            }

            .video-list {
                height: auto;
            }
        }
    </style>
</head>
<body>

<nav class="w3-sidebar w3-bar-block w3-small w3-hide-small w3-center">
    <img src="https://via.placeholder.com/120x80?text=Logo" style="width:100%">
    <a href="#" class="w3-bar-item w3-button w3-padding-large w3-black">
        <i class="fa fa-home w3-xxlarge"></i>
        <p>HOME</p>
    </a>
</nav>

<div class="w3-padding-large" id="main">
    <header class="w3-container w3-padding-32 w3-center" id="home">
        <h1 class="w3-jumbo">Safe Video Feed</h1>
    </header>

    <div class="w3-container">
        <div class="autocomplete">
            <input id="searchInput" type="text" placeholder="Search videos..." class="w3-input w3-border">
        </div>
    </div>

    <div class="w3-row">
        <div class="w3-col l8 s12">
            <div class="video-container">
                <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <div class="w3-col l4 s12">
            <div class="video-list" id="videoList">
            </div>
        </div>
    </div>
</div>

<script>
    const rssFeedUrl = 'https://www.w3schools.com/xml/cd_catalog.xml'; // Placeholder: Replace with your safe video feed URL
    const videoList = document.getElementById('videoList');
    const videoPlayer = document.getElementById('videoPlayer');
    const searchInput = document.getElementById('searchInput');
    let videos = [];

    // Function to fetch and parse the RSS feed
    function fetchRssFeed() {
        fetch(rssFeedUrl)
            .then(response => response.text())
            .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
            .then(data => {
                videos = [];
                // **Important: Adapt this part to your RSS feed's structure**
                const items = data.querySelectorAll("CD"); // Assuming the structure of the sample XML
                items.forEach(item => {
                    const title = item.querySelector("TITLE").textContent;
                    const artist = item.querySelector("ARTIST").textContent;
                    const country = item.querySelector("COUNTRY").textContent;
                    const company = item.querySelector("COMPANY").textContent;
                    const price = item.querySelector("PRICE").textContent;
                    const year = item.querySelector("YEAR").textContent;
                    const imageURL = `https://via.placeholder.com/150?text=${encodeURIComponent(title)}`; // Placeholder image

                    videos.push({
                        title: title,
                        artist: artist,
                        country: country,
                        company: company,
                        price: price,
                        year: year,
                        image: imageURL,
                    });

                    const videoItem = document.createElement('div');
                    videoItem.className = 'video-item';
                    videoItem.innerHTML = `
                        <img src="${imageURL}" alt="${title}">
                        <p class="video-item-text">${title}</p>
                        <p class="video-item-text">Artist: ${artist}</p>
                        <p class="video-item-text">Country: ${country}</p>
                        <p class="video-item-text">Company: ${company}</p>
                        <p class="video-item-text">Price: ${price}</p>
                        <p class="video-item-text">Year: ${year}</p>
                    `;
                    videoItem.addEventListener('click', () => {
                        // Placeholder action: Update video player
                        videoPlayer.src = `https://via.placeholder.com/640x360?text=${encodeURIComponent(title)}`; // Placeholder video URL
                    });
                    videoList.appendChild(videoItem);
                });
                autocomplete(searchInput, videos); // Initialize autocomplete after fetching data
            })
            .catch(error => {
                console.error('Error fetching or parsing RSS feed:', error);
            });
    }

    // Autocomplete function
    function autocomplete(inp, arr) {
        let currentFocus;
        inp.addEventListener("input", function(e) {
            let a, b, i, val = this.value;
            closeAllLists();
            if (!val) { return false;}
            currentFocus = -1;
            a = document.createElement("DIV");
            a.setAttribute("id", this.id + "autocomplete-list");
            a.setAttribute("class", "autocomplete-items");
            this.parentNode.appendChild(a);
            for (i = 0; i < arr.length; i++) {
                if (arr[i].title.substr(0, val.length).toUpperCase() == val.toUpperCase()) {
                    b = document.createElement("DIV");
                    b.innerHTML = "<strong>" + arr[i].title.substr(0, val.length) + "</strong>";
                    b.innerHTML += arr[i].title.substr(val.length);
                    b.innerHTML += "<input type='hidden' value='" + arr[i].title + "'>";
                    b.addEventListener("click", function(e) {
                        inp.value = this.getElementsByTagName("input")[0].value;
                        closeAllLists();
                        // Trigger search or update video list based on selected item
                    });
                    a.appendChild(b);
                }
            }
        });
        inp.addEventListener("keydown", function(e) {
            let x = document.getElementById(this.id + "autocomplete-list");
            if (x) x = x.getElementsByTagName("div");
            if (e.keyCode == 40) { // Down arrow key
                currentFocus++;
                addActive(x);
            } else if (e.keyCode == 38) { // Up arrow key
                currentFocus--;
                addActive(x);
            } else if (e.keyCode == 13) { // Enter key
                e.preventDefault();
                if (currentFocus > -1) {
                    if (x) x[currentFocus].click();
                }
            }
        });
        function addActive(x) {
            if (!x) return false;
            removeActive(x);
            if (currentFocus >= x.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = (x.length - 1);
            x[currentFocus].classList.add("autocomplete-active");
        }
        function removeActive(x) {
            for (let i = 0; i < x.length; i++) {
                x[i].classList.remove("autocomplete-active");
            }
        }
        function closeAllLists(elmnt) {
            let x = document.getElementsByClassName("autocomplete-items");
            for (let i = 0; i < x.length; i++) {
                if (elmnt != x[i] && elmnt != inp) {
                    x[i].parentNode.removeChild(x[i]);
                }
            }
        }
        document.addEventListener("click", function (e) {
            closeAllLists(e.target);
        });
    }

    // Initialize
    fetchRssFeed();
</script>

</body>
</html>
