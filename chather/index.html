<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chaturbate Viewer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css"> 
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@widgetbot/crate@3"></script>
</head>
<body>
    <div class="container">
        <h1>Chaturbate Online Rooms</h1>

        <div class="filters">
            <input type="text" id="filterInput" placeholder="Filter by username" class="form-control">
            <select id="genderFilter" class="form-control">
                <option value="">All Genders</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="couple">Couple</option>
                <option value="trans">Trans</option>
            </select>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <input type="number" id="ageFilterMin" placeholder="Min Age" class="form-control">
                </div>
                <div class="form-group col-md-6">
                    <input type="number" id="ageFilterMax" placeholder="Max Age" class="form-control">
                </div>
            </div>
            <input type="text" id="tagsFilter" placeholder="Filter by tags" class="form-control">
            <div class="form-row">
                <div class="form-group col-md-3">
                    <input type="number" id="numUsersFilterMin" placeholder="Min Users" class="form-control">
                </div>
                <div class="form-group col-md-3">
                    <input type="number" id="numUsersFilterMax" placeholder="Max Users" class="form-control">
                </div>
                <div class="form-group col-md-6">
                    <input type="text" id="countryFilter" placeholder="Filter by country" class="form-control">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-9">
                <div id="rooms" class="scrollable-list room-list"></div>
            </div>
            <div class="col-md-3">
                <h2>Online Users</h2>
                <div id="pagination"></div>
                <div id="onlineUsers" class="scrollmenu scrollable-list user-list"></div>
            </div>
        </div>
            <button id="loadMore" class="btn btn-primary">Load More</button>
            <button id="loadAll" class="btn btn-primary">Load All</button>
            <button id="clearFilters" class="btn btn-primary">Clear Filters</button>
            <button id="clearRooms" class="btn btn-primary">Clear Rooms</button>
            <button id="clearUsers" class="btn btn-primary">Clear Users</button>
            <button id="clearAll" class="btn btn-primary">Clear All</button>
            <button id="toggleAutoRefresh" class="btn btn-primary">Toggle Auto Refresh</button>
            <button id="toggleAutoJoin" class="btn btn-primary">Toggle Auto Join</button>
            <button id="toggleAutoTip" class="btn btn-primary">Toggle Auto Tip</button>
            <button id="toggleAutoPvt" class="btn btn-primary">Toggle Auto Pvt</button>
            <button id="toggleAutoSpy" class="btn btn-primary">Toggle Auto Spy</button>
            <button id="toggleAutoFav" class="btn btn-primary">Toggle Auto Fav</button>
            <button id="toggleAutoFollow" class="btn btn-primary">Toggle Auto Follow</button>
            <button id="toggleAutoMessage" class="btn btn-primary">Toggle Auto Message</button>
            <button id="toggleAutoGift" class="btn btn-primary">Toggle Auto Gift</button>
            <button type="submit" id="submit" class="btn btn-primary">Submit</button>
            <button type="reset" id="reset" class="btn btn-primary">Reset</button>
            <button id="toggleCrate" class="btn btn-primary">Toggle Crate</button>
            <button id="toggleWidget" class="btn btn-primary">Toggle Widget</button>
            <button id="toggleIframe" class="btn btn-primary">Toggle Iframe</button>
            <button id="toggleChat" class="btn btn-primary">Toggle Chat</button>
        </div>
		<div class="row">
			<div class="col-md-3>
        <h2>Online Users</h2>
			<div id="pagination"></div>

        <div id="onlineUsers" class="scrollmenu scrollable-list user-list"></div>

			<div class="col-md-3"> 
                <h2>Previous Users</h2>
                <div id="previousUsers" class="scrollable-list user-list"></div>
            </div>
        <iframe id="mainIframe" src="https://cbxyz.com/in/?tour=dU9X&campaign=9cg6A&track=embed&signup_notice=1&disable_sound=0&mobileRedirect=never&gender=f" frameborder="0" scrolling="no"></iframe> 
        <iframe id="mainIframe" src="https://nancysstays.github.io/texther" frameborder="0" scrolling="no"></iframe> 
    </div>
</div>
    <script>
        // record portion of screen only iframe.
        (function() {
            var iframe = document.getElementById('mainIframe');
            var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            var iframeContent = iframeDoc.documentElement.outerHTML;
            var iframeBlob = new Blob([iframeContent], {type: 'text/html'});
            var iframeUrl = URL.createObjectURL(iframeBlob);
            var iframeDownload = document.createElement('a');
            iframeDownload.href = iframeUrl;
            iframeDownload.download = 'iframe.html';
            iframeDownload.click();
        })();

        // Add button to download iframe content.
        var downloadButton = document.createElement('button');
        downloadButton.textContent = 'Download Iframe';
        downloadButton.addEventListener('click', function() {
            var iframe = document.getElementById('mainIframe');
            var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            var iframeContent = iframeDoc.documentElement.outerHTML;
            var iframeBlob = new Blob([iframeContent], {type: 'text/html'});
            var iframeUrl = URL.createObjectURL(iframeBlob);
            var iframeDownload = document.createElement('a');
            iframeDownload.href = iframeUrl;
            iframeDownload.download = 'iframe.html';
            iframeDownload.click();
        });
        document.body.appendChild(downloadButton);

    </script>
    <script src="script.js"></script> 
</body>
</html>
