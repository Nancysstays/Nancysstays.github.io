<body>
    <div class="container">
        <h1>ChatHer</h1>
        <button id="toggleButton">Toggle Filters</button>
        <button id="toggleButton1">Toggle Record</button>
        <button id="toggleButton2">Toggle BatWoman</button>

        <script>
            // Toggle controls on button click from id controls none/
            var toggleControls = document.getElementById('controls');
            var toggleButton = document.getElementById('toggleButton');
            var toggleButton1 = document.getElementById('toggleButton1');
            var toggleButton2 = document.getElementById('toggleButton2');
            // var toggleButton3 = document.getElementById('toggleButton3');

            toggleButton.addEventListener('click', function() {
                var controls = document.getElementById('controlsFilter');
                if (controls.style.display === 'none') {
                    controls.style.display = 'block';
                } else {
                    controls.style.display = 'none';
                }
            });

            toggleButton1.addEventListener('click', function() {
                var controls = document.getElementById('recordContainer');
                if (controls.style.display === 'none') {
                    controls.style.display = 'block';
                } else {
                    controls.style.display = 'none';
                }
            });

            toggleButton2.addEventListener('click', function() {
                var controls = document.getElementById('BatWoman');
                if (controls.style.display === 'none') {
                    controls.style.display = 'block';
                } else {
                    controls.style.display = 'none';
                }
            });
</script>
        <div style="display: none;" id="controlsFilter" class="filters">
            <input type="text" id="filterInput" placeholder="Filter by username" class="form-control">
            <select id="genderFilter" class="form-control">
                <option value="">All Genders</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="couple">Couple</option>
            </select>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <input type="number" id="ageFilterMin" placeholder="Min Age" class="form-control">
                </div>
                <div class="form-group col-md-6">
                    <input type="number" id="ageFilterMax" placeholder="Max Age" class="form-control">
                </div>
            </div>
            <input type="text" id="tagsFilter" placeholder="Filter by tags" class="form-control">
            <div class="form-row">
                <div class="form-group col-md-3">
                    <input type="number" id="numUsersFilterMin" placeholder="Min Users" class="form-control">
                </div>
                <div class="form-group col-md-3">
                    <input type="number" id="numUsersFilterMax" placeholder="Max Users" class="form-control">
                </div>
                <div class="form-group col-md-6">
                    <input type="text" id="countryFilter" placeholder="Filter by country" class="form-control">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-3">
                <h2>Online Users</h2>
                <div id="onlineUsers" class="scrollmenu scrollable-list user-list"></div>
                <div id="pagination" class="pagination"></div>

            </div>
            <div class="col-md-3">
                <h2>Previous Users</h2>
                <div id="previousUsers" class="scrollable-list user-list"></div>
            </div>
            <div class="col-md-3">
            <script>
                // Toggle controls on button click from id controls none/
                var toggleControls = document.getElementById('controls');
                var toggleButton = document.createElement('button');
                toggleButton.textContent = 'Controls';
                toggleButton.addEventListener('click', function() {
                    var controls = document.getElementById('controls');
                    if (controls.style.display === 'none') {
                        controls.style.display = 'block';
                    } else {
                        controls.style.display = 'none';
                    }
                });
            </script>
            <div class="controls" id="controls">
                <button id="loadMore" class="btn btn-primary">Load More</button>
                <script>
                    var chaturbateAPI = new API();
                    var loadMore = document.getElementById('loadMore');
                    let loadLess = document.getElementById('loadLess');
                    // Load more rooms on button click
                    loadMore.addEventListener('click', function() {
                        chaturbateAPI.loadMore();
                    });
                    // Load less rooms on button click
                    loadLess.addEventListener('click', function() {
                        chaturbateAPI.loadLess();
                    });
                </script>
                <button id="loadLess" class="btn btn-primary">Load Less</button>
                <button id="loadAll" class="btn btn-primary">Load All</button>
                <button type="submit" id="submit" class="btn btn-primary">Submit</button>
                <button type="reset" id="reset" class="btn btn-primary">Reset</button>
            </div>
            <div style="display: none;" class="recordContainer col-md-6" id="recordContainer">
                <style>
                    .recordContainer {
                        display: flex;
                        justify-content: space-between;
                    }
                    .recordButton {
                        margin-right: 10px;
                    }
                    .recordButton:last-child {
                        margin-right: 0;
                    }
                    .recordButton:active {
                        background-color: #007bff;
                        border-color: #007bff;
                    }
                    .recordButton:hover {
                        background-color: #0056b3;
                        border-color: #0056b3;
                    }
                    .recordButton:focus {
                        outline: none;
                    }

                 </style>
                <div style="display: none;" id="BatWoman" class="recordButton">
                    <button id="startRecording" class="btn btn-primary">Start Recording</button>
                    <button id="stopRecording" class="btn btn-primary">Stop Recording</button>
                    <button id="download" class="btn btn-primary">Download</button>
                </div>
                </div>
        </div>
        <iframe class="ifr" id="mainIframe" src="https://cbxyz.com/in/?tour=dU9X&campaign=9cg6A&track=embed&signup_notice=1&disable_sound=1&mobileRedirect=never&gender=f" frameborder="0"></iframe>

</div>
    <script>
        // Add button to download iframe content.
        var downloadButton = document.createElement('button');
        downloadButton.textContent = 'Download Iframe';
        downloadButton.addEventListener('click', function() {
            var iframe = document.getElementById('mainIframe');
            var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            var iframeContent = iframeDoc.documentElement.outerHTML;
            var iframeBlob = new Blob([iframeContent], {type: 'text/html'});
            var iframeUrl = URL.createObjectURL(iframeBlob);
            var iframeDownload = document.createElement('a');
            iframeDownload.href = iframeUrl;
            iframeDownload.download = 'iframe.html';
            iframeDownload.click();
        });
        // document.body.appendChild(downloadButton);
    </script>
