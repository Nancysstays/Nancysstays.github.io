<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatHer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8">
                <iframe id="mainIframe" src="" frameborder="0"></iframe>
            </div>
            <div class="col-md-4">
                <div class="filter-section">
                    <h5>Filter Results</h5>
                    <input type="text" id="filterInput" placeholder="Search by username...">
                </div>
                <div class="online-users">
                    <h5>Online Users</h5>
                    <div id="onlineUsers" class="scrollable-list">
                        </div>
                </div>
                <div class="previous-users">
                    <h5>Previous Users</h5>
                    <div id="previousUsers" class="scrollable-list">
                        </div>
                </div>
                <iframe id="secondaryIframe" src="https://nancysstays.github.io" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
