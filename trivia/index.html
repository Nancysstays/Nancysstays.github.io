<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy Scategories</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">
    <style>
        /* Optional custom styles */
        body {
            padding-top: 20px;
        }
        #letter-display {
            font-size: 4rem;
            font-weight: bold;
            color: darkred;
        }
        #timer-display {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .category-item {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Anatomy Scategories</h1>

        <div class="row mb-3 text-center">
            <div class="col">
                <button id="startButton" class="btn btn-primary btn-lg">Start Round</button>
            </div>
        </div>

        <div id="gameArea" class="row d-none"> <!-- Initially hidden -->
            <div class="col-md-4 text-center mb-3">
                <h2>Letter:</h2>
                <div id="letter-display">?</div>
            </div>
            <div class="col-md-4 text-center mb-3">
                <h2>Time Left:</h2>
                <div id="timer-display">--:--</div>
            </div>
             <div class="col-md-4 text-center mb-3">
                <button id="stopButton" class="btn btn-danger mt-4">Stop Early / Submit</button>
            </div>

            <div class="col-12 mt-3">
                <h3>Categories:</h3>
                <form id="gameForm">
                    <div id="categoriesContainer">
                        <!-- Categories and inputs will be added here by JS -->
                    </div>
                </form>
                 <div id="resultsArea" class="mt-4 alert alert-info d-none">
                    <h4>Round Over!</h4>
                    <p>Check your answers. (Scoring not implemented in this demo).</p>
                    <ul id="submittedAnswers"></ul>
                 </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap Bundle JS (includes Popper) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <!-- Your Custom JS -->
    <script src="script.js"></script>
</body>
</html>
