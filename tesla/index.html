<!DOCTYPE html>
<html>
<head>
<title>Tesla Cars</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<style>
body {
  font-family: Arial, sans-serif;
}
.tesla-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}
.tesla-image {
  flex: 1 0 20%;
  box-sizing: border-box;
  padding: 5px;
  position: relative;
}

.tesla-image img {
  width: 100%;
  height: auto;
  display: block;
}

.year {
  position: absolute;
  top: 10px;
  right: 10px;
  background-color: rgba(0, 0, 0, 0.6);
  color: white;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 14px;
}

h2 {
  overflow: hidden;
  white-space: nowrap;
  position: relative; /* Needed for the translateX to be relative to the h2 itself */
}

h2 span {
  display: inline-block;
  animation: fancy-slide 20s linear forwards; /* Increased duration for the slower parts */
}

@keyframes fancy-slide {
  0% {
    transform: translateX(-110%); /* Start a bit more offscreen to the left */
  }
  25% {
    transform: translateX(75%); /* Move to 90% of the way across in the first 30% of the duration */
    animation-timing-function: ease-in; /* Ease-in for initial acceleration */
  }
  65% {
    transform: translateX(25%); /* Move back to 10% at 65% of the duration (35% of the duration to cover 80% of the distance) */
    animation-timing-function: linear; /* Linear for consistent speed */
  }
  100% {
    transform: translateX(15%); /* Settle at the final position (35% of the duration to cover 10% of the distance, hence slower) */
    animation-timing-function: ease-out; /* Ease-out for smooth deceleration */
  }
}

/* Your existing media queries */
@media (max-width: 900px) {
  .tesla-image {
    flex: 1 0 50%;
  }
}

@media (max-width: 400px) {
  .tesla-image {
    flex: 1 0 100%;
  }
}


</style>
</head>
<body>

<div class="w3-container">
  <h2><span>Tesla Cars</span></h2>

  <div class="tesla-container">
    <div class="tesla-image">
      <img src="https://en.wheelz.me/wp-content/uploads/2024/04/Tesla-Model-3-Performance-12.webp" alt="Tesla Model 3 Performance">
      <span class="year">2024</span>
    </div>
    <div class="tesla-image">
      <img src="https://file.kelleybluebookimages.com/kbb/base/evox/CP/53207/2023-Tesla-Model%203-front_53207_032_2400x1800_PPSW.png" alt="Tesla Model 3 Front">
      <span class="year">2023</span>
    </div>
    <div class="tesla-image">
      <img src="https://autoimage.capitalone.com/stock-media/chrome/2022-Tesla-Model_3-Base-SPW-cc_2022TSC030005_01_2100_SPW.png?width=967&height" alt="Tesla Model 3">
      <span class="year">2022</span>
    </div>
    <div class="tesla-image">
      <img src="https://uploads.onlyusedtesla.com/wp-content/uploads/2021/04/25173422/IMG_2641-1240x503-1.jpg" alt="Tesla Model 3">
      <span class="year">2021</span>
    </div>
    <div class="tesla-image">
      <img src="https://platform.cstatic-images.com/in/v2/stock_photos/f1e950ec-8a23-4c1e-ba55-8a94a4d9638b/5a3152a2-6e23-4b92-9078-76abfa1796dd.png" alt="Tesla Model 3 2020">
      <span class="year">2020</span>
    </div>
  </div>
</div>

</body>
</html>
