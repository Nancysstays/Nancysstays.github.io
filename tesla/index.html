<!DOCTYPE html>
<html>
<head>
<title>Tesla Cars</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<style>
body {
  font-family: Arial, sans-serif;
}
.tesla-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}
.tesla-image {
  flex: 1 0 20%;
  box-sizing: border-box;
  padding: 5px;
  position: relative;
}

.tesla-image img {
  width: 100%;
  height: auto;
  display: block;
}

.year {
  position: absolute;
  top: 10px;
  right: 10px;
  background-color: rgba(0, 0, 0, 0.6);
  color: white;
  padding: 5px 10px;
  border-radius: 5px;
  font-size: 14px;
}

@media (max-width: 600px) {
  .tesla-image {
    flex: 1 0 50%;
  }
}

@media (max-width: 400px) {
  .tesla-image {
    flex: 1 0 100%;
  }
}

h2 {
  overflow: hidden;
  white-space: nowrap;
}

h2 span {
  display: inline-block;
  animation: fancy-slide 3s ease-in-out forwards;
}

@keyframes fancy-slide {
  0% {
    transform: translateX(-100%);
  }
  60% {
    transform: translateX(calc(100% + 50px)); 
  }
  80% {
    transform: translateX(calc(100% - 50px));
  }
  100% {
    transform: translateX(0);
  }
}
</style>
</head>
<body>

<div class="w3-container">
  <h2><span>Tesla Cars</span></h2>

  <div class="tesla-container">
    <div class="tesla-image">
      <img src="https://en.wheelz.me/wp-content/uploads/2024/04/Tesla-Model-3-Performance-12.webp" alt="Tesla Model 3 Performance">
      <span class="year">2024</span>
    </div>
    <div class="tesla-image">
      <img src="https://evpowerhouse.com.au/wp-content/uploads/2024/03/tesla-model-3-2024.webp" alt="Tesla Model 3 2024">
      <span class="year">2024</span>
    </div>
    <div class="tesla-image">
      <img src="https://file.kelleybluebookimages.com/kbb/base/evox/CP/53207/2023-Tesla-Model%203-front_53207_032_2400x1800_PPSW.png" alt="Tesla Model 3 Front">
      <span class="year">2023</span>
    </div>
    <div class="tesla-image">
      <img src="https://media.motorfuse.com/img.cfm/type/3/img/0F16CD4A4C0FDCD4CFE6A8C1C4291754EFDC" alt="Tesla Model 3">
      <span class="year">2023</span>
    </div>
    <div class="tesla-image">
      <img src="https://uploads.onlyusedtesla.com/wp-content/uploads/2021/04/25173422/IMG_2641-1240x503-1.jpg" alt="Tesla Model 3">
      <span class="year">2021</span>
    </div>
  </div>
</div>

</body>
</html>
