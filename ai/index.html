<!DOCTYPE html>
<html>
<head>
  <title>Jinx Nancy</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body>
  <div class="w3-container">
    <form id="myForm">
      <textarea id="userInput" class="w3-input w3-border" rows="10" cols="50"></textarea>
      <br>
      <button type="button" class="w3-button w3-blue" onclick="processText()">Process Text</button>
    </form>
  </div>

  <script>
    const apiKey = "AIzaSyDiS4F6RE04oMW3BpURdHXXhbtOg3n65OA";
    const genAI = new GoogleGenerativeAI(apiKey);

    const model = genAI.getGenerativeModel({
      model: "gemini-2.0-flash-thinking-exp-01-21",
      tools: [{ codeExecution: {} }],
    });

    const generationConfig = {
      temperature: 2,
      topP: 1,
      topK: 64,
      maxOutputTokens: 59999,
      stopSequences: ["`"],
      responseMimeType: "text/plain",
    };

    async function processText() {
      const userInput = document.getElementById("userInput").value;

      const chatSession = model.startChat({
        generationConfig,
        history: [],
      });

      const result = await chatSession.sendMessage(userInput);
      console.log(result.response.text());
    }
  </script>
</body>
</html>
