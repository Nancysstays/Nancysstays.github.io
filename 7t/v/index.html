<!DOCTYPE html>
<html>
<head>
    <title>Unusual Volume Stocks</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../color.css">
    <!-- Stanford: 8C1515 -->
</head>
<body class="w3-light-grey">
    <div class="w3-container w3-blue w3-center">
        <h1>Unusual Volume Stocks (USA)</h1>
    </div>

    <div class="w3-container">
        <table id="stock-table" class="w3-table w3-striped w3-bordered">
            <thead>
                <tr class="w3-blue">
                    <th>Symbol</th>
                    <th>Last</th>
                    <th>Change %</th>
                    <th>Change</th>
                    <th>Rating</th>
                    <th>Volume</th>
                    <th>Mkt Cap</th>
                    <th>P/E</th>
                    <th>EPS</th>
                    <th>Employees</th>
                    <th>Sector</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
        <div id="loading" class="w3-center">
            <p>Loading data...</p>
        </div>
        <div id="error" class="w3-center w3-red" style="display: none;">
            <p>Error fetching data. Please try again later.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
