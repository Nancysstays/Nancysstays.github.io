<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/umd/popper.min.js"></script>
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Shopping List App</h1>

        <div class="row">
            <div class="col-md-4">
                <h2>Lists</h2>
                <ul id="lists-container" class="list-group">
                </ul>
                <div class="input-group mt-3">
                    <input type="text" id="new-list-name" class="form-control" placeholder="New list name">
                    <button id="create-list" class="btn btn-primary">Create List</button>
                </div>
            </div>

            <div class="col-md-8">
                <h2>List Items</h2>
                <ul id="list-items" class="list-group">
                </ul>
                <div class="input-group mt-3">
                    <input type="text" id="new-item" class="form-control" placeholder="Item name">
                    <input type="number" id="new-item-quantity" class="form-control" placeholder="Qty" min="1">
                    <input type="number" id="new-item-price" class="form-control" placeholder="Price" min="0"
                        step="0.01">
                    <button id="add-item" class="btn btn-primary">Add Item</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
