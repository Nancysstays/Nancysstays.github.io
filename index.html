<!DOCTYPE html>
<html>
<head>
    <title>Stock and GenAI Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Financial Data Explorer & GenAI Insights</h1>

    <label for="apiSelector">Select Data Type:</label>
    <select id="apiSelector">
        <option value="optionsStraddle">Options Straddle (AAPL)</option>
        <option value="ipoCalendar">IPO Calendar</option>
        <option value="stockHistory">Stock History</option>
        <option value="marketQuote">Market Quote</option>
        <option value="marketScreenerDayGainers">Market Screener (Day Gainers)</option>
        <option value="insiderTrades">Insider Trades</option>
        <option value="mostActiveOptions">Most Active Options</option>
        <!-- Google Finance Data option will be added later -->
    </select>

    <div id="inputFieldsContainer">
        <!-- 
            Dynamic input fields will be managed by script.js.
            Examples of how they might look:

        <div id="ipoCalendarInputs" class="apiInputs" style="display:none;">
            <label for="ipoDate">Date (YYYY-MM):</label>
            <input type="text" id="ipoDate" placeholder="YYYY-MM">
        </div>

        <div id="stockHistoryInputs" class="apiInputs" style="display:none;">
            <label for="stockSymbol">Symbol:</label>
            <input type="text" id="stockSymbol" placeholder="e.g., AAPL">
            <label for="stockInterval">Interval:</label>
            <input type="text" id="stockInterval" placeholder="e.g., 5m">
        </div>

        <div id="marketQuoteInputs" class="apiInputs" style="display:none;">
            <label for="quoteTicker">Ticker:</label>
            <input type="text" id="quoteTicker" placeholder="e.g., AAPL">
            <label for="quoteType">Type:</label>
            <input type="text" id="quoteType" placeholder="e.g., STOCKS">
        </div>
        
        <div id="mostActiveOptionsInputs" class="apiInputs" style="display:none;">
            <label for="mostActiveType">Type:</label>
            <input type="text" id="mostActiveType" placeholder="e.g., STOCKS">
        </div>
        -->
    </div>

    <button id="fetchDataButton">Fetch Selected Data</button>

    <hr style="margin-top: 20px; margin-bottom: 20px;">

    <h2 id="dataHeading">Data Display</h2>
    <div id="yahoo-data-container"> <!-- Reusing this container, consider renaming ID later if needed -->
        <pre id="yahoo-data"></pre> <!-- Reusing this pre tag, consider renaming ID later if needed -->
    </div>
    <p id="yahoo-error" class="error"></p> <!-- Reusing this error p tag, consider renaming ID later if needed -->

    <h2>GenAI Explanation of Data</h2> <!-- This heading was already updated in a previous step -->
    <div id="genai-output-container">
        <pre id="genai-data"></pre>
    </div>
    <p id="genai-error" class="error"></p>

    <div class="genai-options-section">
        <label for="genaiAnalysisType">Select GenAI Analysis Type:</label>
        <select id="genaiAnalysisType">
            <option value="simpleExplanation" selected>Simple Explanation</option>
            <option value="potentialStrategies">Identify Potential Strategies</option>
            <option value="risksOpportunities">Key Risks & Opportunities</option>
            <option value="bullishBearishCase">Bullish Case / Bearish Case</option>
        </select>
        <p class="note">The selected analysis type will be applied when data is fetched.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-asm.js"></script>
    <script src="script.js"></script>
</body>
</html>
